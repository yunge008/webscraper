<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>TK评论抓取</title>
	<link rel="stylesheet" href="tiktok_reviews.css">
</head>
<body>
	<main class="tk-app">
		<header class="tk-header">
			<h1>TK小店评论抓取 <span id="version" class="tk-muted"></span></h1>
			<p id="pageStatus" class="tk-muted">正在识别商品评价页…</p>
		</header>
		<p id="errorBanner" class="tk-error" role="alert" hidden></p>

		<section class="tk-control">
			<fieldset class="tk-mode">
				<legend>采集范围</legend>
				<label class="tk-radio"><input type="radio" name="mode" value="current" checked> 当前页面筛选结果（保留日期、星级等条件）</label>
				<label class="tk-radio"><input type="radio" name="mode" value="ids"> 指定商品 / SKU ID（一个或多个）</label>
			</fieldset>

			<div id="idsBox" hidden>
				<label for="productIds">商品 / SKU ID（一行一个；只填一个即为固定单个商品）</label>
				<textarea id="productIds" rows="4" spellcheck="false" placeholder="1731892023085009910"></textarea>
				<div class="tk-inline">
					<label class="tk-file">上传 Excel（含 id 列）<input id="idFile" type="file" accept=".xlsx,.xls,.csv"></label>
					<span id="idCount" class="tk-muted">0 个 ID</span>
				</div>
				<p class="tk-muted">ID 会自动保存，刷新页面或重开侧栏不会丢失。页面上的日期等其他筛选条件保持不变，只替换商品条件；返回的评论必须全部属于该 ID，否则停止，不会改抓全店评论。</p>
			</div>

			<div class="tk-grid">
				<label>起始页<input id="startPage" type="number" min="1" value="1"></label>
				<label>终止页<input id="endPage" type="number" min="1" placeholder="全部"></label>
				<label>每页条数<input id="pageSize" type="number" min="1" max="200" value="50"></label>
				<label>每批页数<input id="batchSize" type="number" min="1" max="1000" value="50"></label>
				<label>页间隔(ms)<input id="delayMs" type="number" min="0" max="10000" value="600"></label>
				<label>翻页方式
					<select id="driver">
						<option value="auto">自动（接口优先）</option>
						<option value="api">仅接口直连</option>
						<option value="ui">仅页面点击翻页</option>
					</select>
				</label>
			</div>
			<label class="tk-radio"><input id="reloadEachBatch" type="checkbox" checked> 每批结束后刷新评价页释放内存（仅接口直连；筛选条件已保存在任务中，不受影响）</label>
			<p class="tk-muted">终止页留空 = 采集全部页。“每页条数”仅在接口直连时生效，最大 200，服务器若有上限会自动按实际条数继续；页面点击模式沿用页面当前每页条数。</p>

			<div class="tk-actions">
				<button id="createTask" type="button" class="tk-primary">创建并开始任务</button>
				<button id="pauseTask" type="button" disabled>暂停</button>
				<button id="resumeTask" type="button" disabled>继续</button>
			</div>

			<div class="tk-stats">
				<div><span class="tk-stat-label">接口总条数</span><strong id="statTotal">-</strong></div>
				<div><span class="tk-stat-label">已采集</span><strong id="statRows">0</strong></div>
				<div><span class="tk-stat-label">评价图</span><strong id="statImages">0</strong></div>
				<div><span class="tk-stat-label">翻页方式</span><strong id="statDriver">-</strong></div>
			</div>
			<progress id="progress" value="0" max="100" class="tk-progress-full"></progress>
			<p id="status" class="tk-status-row" role="status" aria-live="polite">准备就绪。</p>
		</section>

		<section class="tk-section">
			<div class="tk-inline">
				<label for="taskSelect">已保存任务</label>
				<select id="taskSelect"><option value="">暂无任务</option></select>
			</div>
			<p id="taskInfo" class="tk-muted"></p>
			<div class="tk-actions">
				<button id="exportXlsx" type="button" disabled>导出 Excel</button>
				<button id="downloadImages" type="button" disabled>下载评价图</button>
				<button id="deleteTask" type="button" disabled>删除任务</button>
			</div>
		</section>

		<section class="tk-section tk-results">
			<div class="tk-summary"><span id="rowCount">预览（最近 50 条）</span></div>
			<div class="tk-table-wrap">
				<table>
					<thead><tr id="previewHead"></tr></thead>
					<tbody id="previewBody"></tbody>
				</table>
			</div>
		</section>
	</main>
	<script src="sheetjs-0.20.3.min.js"></script>
	<script src="tiktok_core.js"></script>
	<script src="tiktok_store.js"></script>
	<script src="tiktok_product_import.js"></script>
	<script src="tiktok_reviews.js"></script>
</body>
</html>
